name: Renovate Linter

on:
  pull_request:
    paths:
      - 'renovate.json'
      - 'taskfiles/taskfile.renovate.yaml'
      - '.github/actions/setup-dagger/**'
      - '.github/workflows/renovate-lint.yml'
  push:
    branches:
      - main
    paths:
      - 'renovate.json'
      - 'taskfiles/taskfile.renovate.yaml'
      - '.github/actions/setup-dagger/**'
      - '.github/workflows/renovate-lint.yml'

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup dagger
        uses: ./.github/actions/setup-dagger

      - name: Validate Renovate JSON
        run: task --taskfile taskfiles/taskfile.renovate.yaml validate
