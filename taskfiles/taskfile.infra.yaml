# renovate: datasource=github-tags depName=go-task/task versioning=semver
version: 3.54.0

vars:
  REGISTRY_NETWORK: cnpg
  REGISTRY_NAME: '{{ .REGISTRY_NAME | default "registry.cnpg" }}'
  REGISTRY_HOST_PORT: '{{ .REGISTRY_HOST_PORT | default 5000 }}'
  REGISTRY_INTERNAL_PORT: 5000
  REGISTRY_CA_VOLUME: cnpg-registry-tls
  DOCKER_BUILDER: cnpg
  DAGGER_ENGINE: dagger-engine-cnpg
  # renovate: datasource=docker depName=busybox versioning=docker
  BUSYBOX_VERSION: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4

  # renovate: datasource=docker depName=alpine versioning=docker
  ALPINE_IMAGE: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  # renovate: datasource=github-releases depName=kubernetes-sigs/kind
  KIND_VERSION: v0.33.0
  # renovate: datasource=docker depName=kindest/node versioning=docker
  KIND_NODE_TAG: v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  # renovate: datasource=docker depName=alpine/kubectl versioning=docker
  KUBECTL_IMAGE: alpine/kubectl:1.37.1@sha256:8c72f6f732ce7ef11cdb1bea25faa4f4a521872a12c89e3f40ba9edb52a4d4f2
  # renovate: datasource=github-tags depName=cloudnative-pg/cloudnative-pg versioning=semver-coerced extractVersion=^v(?<version>\d+\.\d+\.\d+)$
  CNPG_RELEASE_DEFAULT: 1.30.1
  # Prints the URL of the CloudNativePG manifest for the release
  CNPG_MANIFEST_SCRIPT: |
    input="${release}"
    release="${release#v}"
    if [ "${release}" = "main" ]; then
      echo "https://raw.githubusercontent.com/cloudnative-pg/artifacts/main/manifests/operator-manifest.yaml"
    elif echo "${release}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$'; then
      echo "https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/v${release}/releases/cnpg-${release}.yaml"
    else
      echo "CNPG_RELEASE must be 'main', a full version like 1.30.1 or a release candidate like 1.30.0-rc1, got '${input}'" >&2
      exit 1
    fi

  DOCKER_SOCKET:
    sh: docker context inspect -f {{`'{{json .Endpoints.docker.Host}}'`}} $(docker context show)
  KIND_INSTALL_SCRIPT: >-
    set -e;
    ARCH=\$(uname -m);
    case \${ARCH} in
    x86_64) ARCH=amd64 ;;
    aarch64) ARCH=arm64 ;;
    *) echo unsupported arch: \${ARCH} >&2; exit 1 ;;
    esac;
    wget -qO /usr/local/bin/kind https://github.com/kubernetes-sigs/kind/releases/download/{{ .KIND_VERSION }}/kind-linux-\${ARCH};
    chmod +x /usr/local/bin/kind
  KIND_TOOLBOX: >-
    dagger core container from --address={{ .ALPINE_IMAGE }}
    with-exec --args="apk","add","--no-cache","docker-cli"
    with-exec --args="sh","-c","{{ .KIND_INSTALL_SCRIPT }}"
    with-unix-socket --path=/var/run/docker.sock --source={{ .DOCKER_SOCKET }}
    with-env-variable --name=DOCKER_HOST --value=unix:///var/run/docker.sock
    with-env-variable --name=KIND_EXPERIMENTAL_DOCKER_NETWORK --value={{ .REGISTRY_NETWORK }}
    with-env-variable --name=CACHE_BUSTER --value="$(date)"

tasks:
  generate-certs:
    desc: Generate certificates for the local registry
    run: once
    internal: true
    cmds:
      - docker volume create {{ .REGISTRY_CA_VOLUME }}
      - >
        docker run --rm -v {{ .REGISTRY_CA_VOLUME }}:/certs -w /certs --entrypoint=/bin/sh alpine/openssl -c '
        openssl genrsa -out ca-key.pem 4096 &&
        openssl req -new -x509 -days 365 -key ca-key.pem -sha256 -out ca.pem \
            -subj "/O=CloudNativePG/OU=CNPG Testing" &&
        openssl genrsa -out server-key.pem 4096 &&
        openssl req -subj "/CN={{ .REGISTRY_NAME }}" -sha256 -new -key server-key.pem -out server.csr &&
        echo subjectAltName = DNS:{{ .REGISTRY_NAME }},IP:127.0.0.1 >> extfile.cnf &&
        echo extendedKeyUsage = serverAuth >> extfile.cnf &&
        openssl x509 -req -days 365 -sha256 -in server.csr -CA ca.pem -CAkey ca-key.pem \
            -CAcreateserial -out server-cert.pem -extfile extfile.cnf'
    status:
      - docker volume inspect {{ .REGISTRY_CA_VOLUME }}
      - docker run --rm -v {{ .REGISTRY_CA_VOLUME }}:/certs:ro busybox:{{ .BUSYBOX_VERSION }} test -s /certs/server-cert.pem

  setup-docker-network:
    desc: Setup Docker network to connect all the services
    run: once
    cmds:
      - docker network create {{ .REGISTRY_NETWORK }}
    status:
      - docker network inspect {{ .REGISTRY_NETWORK }}

  setup-container-registry:
    desc: Setup a local container registry
    run: once
    deps:
      - generate-certs
      - setup-docker-network
    env:
      # renovate: datasource=docker depName=registry versioning=docker
      REGISTRY_VERSION: 3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
    cmds:
      - >
        docker run -d --name {{ .REGISTRY_NAME }}
        --network {{ .REGISTRY_NETWORK }}
        -v {{ .REGISTRY_CA_VOLUME }}:/certs
        -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server-cert.pem -e REGISTRY_HTTP_TLS_KEY=/certs/server-key.pem
        -p {{ .REGISTRY_HOST_PORT }}:{{ .REGISTRY_INTERNAL_PORT }}
        registry:${REGISTRY_VERSION}
    status:
      - \[ "$(docker inspect -f {{`'{{.State.Running}}'`}} "{{ .REGISTRY_NAME }}" 2> /dev/null)" == 'true' \]

  setup-docker-builder:
    desc: Create a buildx builder
    run: once
    deps:
      - setup-docker-network
    vars:
      # renovate: datasource=docker depName=moby/buildkit versioning=docker
      BUILDER_IMAGE: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
    cmds:
      - |
        cat > buildkitd.toml <<EOF
        [registry."{{ .REGISTRY_NAME }}:{{ .REGISTRY_INTERNAL_PORT }}"]
          insecure = true
        EOF
      - defer: rm -f buildkitd.toml
      - >
        docker buildx create --name {{ .DOCKER_BUILDER }}
        --driver docker-container
        --driver-opt "image={{ .BUILDER_IMAGE }}"
        --driver-opt "network={{ .REGISTRY_NETWORK }}"
        --buildkitd-config buildkitd.toml
        --bootstrap
    status:
      - docker buildx inspect {{ .DOCKER_BUILDER }}

  setup-dagger-engine:
    desc: Start a custom Dagger engine
    summary: |
      Starts a Dagger engine container attached to the local registry's
      Docker network, so Dagger pipelines can reach the registry.

      Dagger does not use this engine automatically. Point the Dagger
      CLI to it by setting, in the environment that runs the pipelines:

        _EXPERIMENTAL_DAGGER_RUNNER_HOST=docker-container://{{ .DAGGER_ENGINE }}
    run: once
    deps:
      - setup-docker-network
    vars:
      # renovate: datasource=github-tags depName=dagger/dagger versioning=semver
      DAGGER_ENGINE_VERSION: v0.21.11
    cmds:
      - >
        docker run -d -v /var/lib/dagger
        --name {{ .DAGGER_ENGINE }}
        --restart always
        --network {{ .REGISTRY_NETWORK }}
        --privileged registry.dagger.io/engine:{{ .DAGGER_ENGINE_VERSION }}
    status:
      - test "$(docker inspect -f {{`'{{json .State.Running}}'`}} {{ .DAGGER_ENGINE }})" == "true"

  setup-kind:
    desc: Setup a Kind cluster
    summary: |
      Creates a Kind cluster attached to the local Docker network.

      Variables:
        CLUSTER_NAME  Name of the cluster (default: cnpg-<k8s_version>).
        NODES         Total number of nodes (default: 1).
        KIND_NODE_TAG kindest/node image tag, optionally with digest
                      (default: DEFAULT_KIND_NODE_TAG).
        PRIVATE_REGISTRY_HOST, PRIVATE_REGISTRY_USERNAME,
        PRIVATE_REGISTRY_PASSWORD (env)
                      Credentials for a private registry, set on the nodes
                      through setup-kind-credentials.
    deps:
      - setup-dagger-engine
    run: when_changed
    vars:
      K8S_VERSION: '{{ regexReplaceAll "^v([0-9.]+).*" .KIND_NODE_TAG "$1" }}'
      CLUSTER_NAME: '{{ .CLUSTER_NAME | default (printf "cnpg-%s" .K8S_VERSION) }}'
      REGISTRY_DIR: /etc/containerd/certs.d/{{ .REGISTRY_NAME }}:{{ .REGISTRY_INTERNAL_PORT }}
      NODES: '{{ .NODES | default 1 }}'
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: container://{{ .DAGGER_ENGINE }}
    preconditions:
      - sh: test "{{ .NODES }}" -ge 1 2>/dev/null
        msg: "NODES must be an integer >= 1, got '{{ .NODES }}'"
    cmds:
      - |
        KIND_CONFIG=$(cat <<'EOF'
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        containerdConfigPatches:
          - |-
            [plugins."io.containerd.cri.v1.images".registry]
              config_path = "/etc/containerd/certs.d"
        nodes:
          - role: control-plane
        EOF
        )
        i=1
        while [ "${i}" -lt {{ .NODES }} ]; do
          KIND_CONFIG="${KIND_CONFIG}
          - role: worker"
          i=$((i + 1))
        done
        {{ .KIND_TOOLBOX }} \
        with-new-file --contents="${KIND_CONFIG}" --path=/root/kind-config.yaml \
        with-exec --args="kind","create","cluster","--name","{{ .CLUSTER_NAME }}","--image","kindest/node:{{ .KIND_NODE_TAG }}","--config","/root/kind-config.yaml","--wait","10m" sync
      # Skip TLS verification for the local registry
      - |
        for node in $(docker ps -q --filter "label=io.x-k8s.kind.cluster={{ .CLUSTER_NAME }}"); do
          docker exec "${node}" mkdir -p "{{ .REGISTRY_DIR }}"
          cat <<EOF | docker exec -i "${node}" cp /dev/stdin "{{ .REGISTRY_DIR }}/hosts.toml"
        server = "https://{{ .REGISTRY_NAME }}:{{ .REGISTRY_INTERNAL_PORT }}"
        skip_verify = true
        EOF
        done
      - task: setup-kind-credentials
        if: '{{ if and .PRIVATE_REGISTRY_HOST .PRIVATE_REGISTRY_USERNAME .PRIVATE_REGISTRY_PASSWORD }}true{{ else }}false{{ end }}'
        vars:
          CLUSTER_NAME: '{{ .CLUSTER_NAME }}'
          PRIVATE_REGISTRY_HOST: '{{ .PRIVATE_REGISTRY_HOST }}'
          PRIVATE_REGISTRY_USERNAME: '{{ .PRIVATE_REGISTRY_USERNAME }}'
    status:
      - >
        test "$({{ .KIND_TOOLBOX }}
        with-exec --args="sh","-c","kind get clusters 2>/dev/null | grep -qx {{ .CLUSTER_NAME }} && echo true || echo false" stdout)" = "true"

  export-kubeconfig:
    desc: Export the kubeconfig of the Kind cluster to KUBECONFIG_PATH
    summary: |
      Writes the kubeconfig of the Kind cluster created by setup-kind to
      KUBECONFIG_PATH, so other tasks can reach the cluster. Fails if the
      cluster does not exist.

      Variables:
        CLUSTER_NAME     Name of the cluster (default: cnpg-<k8s_version>).
        KUBECONFIG_PATH  Required. File the kubeconfig is written to.
                          Its parent directory is created.
        INTERNAL         When "true", use the internal address of the API
                          server. Default: "false"
        WORKDIR          Directory where the task is executed.
                          Default: {{ .USER_WORKING_DIR }}
    deps:
      - setup-dagger-engine
    vars:
      K8S_VERSION: '{{ regexReplaceAll "^v([0-9.]+).*" .KIND_NODE_TAG "$1" }}'
      CLUSTER_NAME: '{{ .CLUSTER_NAME | default (printf "cnpg-%s" .K8S_VERSION) }}'
      INTERNAL: '{{ .INTERNAL | default "false" }}'
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: container://{{ .DAGGER_ENGINE }}
    requires:
      vars:
        - name: KUBECONFIG_PATH
        - name: INTERNAL
          enum: ["true", "false"]
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    preconditions:
      - sh: >
          test "$( {{ .KIND_TOOLBOX }}
          with-exec --args="sh","-c","kind get clusters 2>/dev/null | grep -qx {{ .CLUSTER_NAME }} && echo true || echo false" stdout)" = "true"
        msg: "Kind cluster '{{ .CLUSTER_NAME }}' not found"
    cmds:
      - |
        CONFIG=$({{ .KIND_TOOLBOX }} \
          with-exec --args="kind","get","kubeconfig","--name","{{ .CLUSTER_NAME }}","--internal={{ .INTERNAL }}" stdout)
        {{- if eq .INTERNAL "true" }}
        # Dagger's DNS (dnsmasq with domain-needed) never forwards single-label
        # names, so the bare node name can't be resolved from Dagger containers.
        # Use the <container>.<network> name Docker also serves, and keep TLS
        # checking against the node name the API server certificate carries.
        # The escaped newline, unlike \n, also works with BSD sed on macOS.
        CONFIG=$(echo "${CONFIG}" | sed -E \
          's#^( *)server: https://({{ .CLUSTER_NAME }}-control-plane):#\1tls-server-name: \2\
        \1server: https://\2.{{ .REGISTRY_NETWORK }}:#')
        {{- end }}
        mkdir -p $(dirname {{ .KUBECONFIG_PATH }})
        echo "${CONFIG}" > {{ .KUBECONFIG_PATH }}

  setup-kind-credentials:
    desc: Set credentials for an external registry on the Kind nodes
    summary: |
      Writes the credentials of a private registry to
      /var/lib/kubelet/config.json on every node, so pods can pull from it
      without imagePullSecrets. All three variables are required.
      Entries are merged: run once per registry, or again to refresh.

      Variables:
        CLUSTER_NAME               Name of the cluster
                                   (default: cnpg-<k8s_version>).
        PRIVATE_REGISTRY_HOST      Registry to authenticate to, e.g. ghcr.io.
        PRIVATE_REGISTRY_USERNAME  Username for the registry.

      Environment variables:
        PRIVATE_REGISTRY_PASSWORD  Password or token.
    vars:
      K8S_VERSION: '{{ regexReplaceAll "^v([0-9.]+).*" .KIND_NODE_TAG "$1" }}'
      CLUSTER_NAME: '{{ .CLUSTER_NAME | default (printf "cnpg-%s" .K8S_VERSION) }}'
    requires:
      vars:
        - name: PRIVATE_REGISTRY_HOST
        - name: PRIVATE_REGISTRY_USERNAME
    preconditions:
      - sh: 'test -n "${PRIVATE_REGISTRY_PASSWORD}"'
        msg: "PRIVATE_REGISTRY_PASSWORD environment variable must be set and non-empty"
    cmds:
      - |
        set -e
        nodes=$(docker ps -q --filter "label=io.x-k8s.kind.cluster={{ .CLUSTER_NAME }}")
        if [ -z "${nodes}" ]; then
          echo "error: no nodes found for cluster {{ .CLUSTER_NAME }}" >&2
          exit 1
        fi
        # The password travels on stdin, so it shows up neither in the logs nor in `ps`.
        # The script runs inside the node (Debian), where GNU base64 and jq are available.
        for node in ${nodes}; do
          printf '%s' "${PRIVATE_REGISTRY_PASSWORD}" | docker exec -i \
            -e HOST="{{ .PRIVATE_REGISTRY_HOST }}" -e USERNAME="{{ .PRIVATE_REGISTRY_USERNAME }}" \
            "${node}" sh -c '
              set -e
              umask 077
              file=/var/lib/kubelet/config.json
              mkdir -p /var/lib/kubelet
              [ -f "${file}" ] || echo "{}" > "${file}"
              auth=$(printf "%s:%s" "${USERNAME}" "$(cat)" | base64 -w0)
              # Add or replace the entry for this host only, then swap the file in
              # so the kubelet never reads a partial one.
              jq --arg host "${HOST}" --arg auth "${auth}" ".auths[\$host] = {auth: \$auth}" "${file}" > "${file}.tmp"
              mv "${file}.tmp" "${file}"
              echo "set credentials for ${HOST} on $(hostname)"
            '
        done

  setup-cnpg:
    desc: Install the CloudNativePG operator in a Kubernetes cluster
    summary: |
      Installs the CloudNativePG operator in the Kubernetes cluster
      referenced by KUBECONFIG_PATH.

      Variables:
        CNPG_RELEASE     CloudNativePG release, either 'main', a full
                         version like 1.30.1 or a release candidate like
                         1.30.0-rc1.
                         (default: CNPG_RELEASE_DEFAULT).
        KUBECONFIG_PATH  Required. Path of the kubeconfig file of the
                         cluster to install the operator in.
        WORKDIR          Directory where the task is executed.
                         Default: {{ .USER_WORKING_DIR }}
    deps:
      - setup-dagger-engine
    run: when_changed
    vars:
      CNPG_RELEASE: '{{ .CNPG_RELEASE | default .CNPG_RELEASE_DEFAULT }}'
      CNPG_MANIFEST:
        sh: |
          release={{ .CNPG_RELEASE | shellQuote }}
          {{ .CNPG_MANIFEST_SCRIPT }}
      KUBECTL_TOOLBOX: >-
        dagger --progress plain core container
        from --address {{ .KUBECTL_IMAGE }}
        with-mounted-file --path /root/.kube/config --source {{ .KUBECONFIG_PATH | shellQuote }}
        with-env-variable --name=CACHE_BUSTER --value="$(date)"
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: container://{{ .DAGGER_ENGINE }}
    requires:
      vars:
        - name: KUBECONFIG_PATH
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    preconditions:
      - sh: 'test -f {{ .KUBECONFIG_PATH | shellQuote }}'
        msg: "KUBECONFIG_PATH '{{ .KUBECONFIG_PATH }}' does not exist"
    cmds:
      - >
        {{ .KUBECTL_TOOLBOX }}
        with-exec --args=apply,--server-side,-f,{{ .CNPG_MANIFEST }} --use-entrypoint
        with-exec --args=wait,--for=condition=Available,--timeout=2m,-n,cnpg-system,deployments/cnpg-controller-manager --use-entrypoint
        sync
    status:
      - >
        {{ .KUBECTL_TOOLBOX }}
        with-exec --args=get,-n,cnpg-system,deployments/cnpg-controller-manager --use-entrypoint
        sync

  teardown-cnpg:
    desc: Uninstall the CloudNativePG operator from a Kubernetes cluster
    summary: |
      Deletes the resources of the CloudNativePG manifest of CNPG_RELEASE
      from the Kubernetes cluster referenced by KUBECONFIG_PATH.

      Variables:
        CNPG_RELEASE     CloudNativePG release that was installed, either
                         'main', a full version like 1.30.1 or a release
                         candidate like 1.30.0-rc1.
                         (default: CNPG_RELEASE_DEFAULT).
        KUBECONFIG_PATH  Required. Path of the kubeconfig file of the
                         cluster to uninstall the operator from.
        WORKDIR          Directory where the task is executed.
                         Default: {{ .USER_WORKING_DIR }}
    deps:
      - setup-dagger-engine
    vars:
      CNPG_RELEASE: '{{ .CNPG_RELEASE | default .CNPG_RELEASE_DEFAULT }}'
      CNPG_MANIFEST:
        sh: |
          release={{ .CNPG_RELEASE | shellQuote }}
          {{ .CNPG_MANIFEST_SCRIPT }}
      KUBECTL_TOOLBOX: >-
        dagger --progress plain core container
        from --address {{ .KUBECTL_IMAGE }}
        with-mounted-file --path /root/.kube/config --source {{ .KUBECONFIG_PATH | shellQuote }}
        with-env-variable --name=CACHE_BUSTER --value="$(date)"
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: container://{{ .DAGGER_ENGINE }}
    requires:
      vars:
        - name: KUBECONFIG_PATH
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    preconditions:
      - sh: 'test -f {{ .KUBECONFIG_PATH | shellQuote }}'
        msg: "KUBECONFIG_PATH '{{ .KUBECONFIG_PATH }}' does not exist"
    cmds:
      - >
        {{ .KUBECTL_TOOLBOX }}
        with-exec --args=delete,--ignore-not-found,-f,{{ .CNPG_MANIFEST }} --use-entrypoint
        sync
    status:
      - >
        out=$({{ .KUBECTL_TOOLBOX }}
        with-exec --args=get,--ignore-not-found,-o,name,-n,cnpg-system,deployments/cnpg-controller-manager --use-entrypoint
        stdout) && test -z "${out}"

  teardown:
    desc: Teardown the resources created by the tasks
    silent: true
    cmds:
      - task: teardown-container-registry
      - task: teardown-builder
      - task: teardown-kind
      - task: teardown-dagger-engine
      - task: teardown-docker-network

  teardown-kind:
    desc: Delete the Kind cluster identified by CLUSTER_NAME
    summary: |
      Deletes the cluster with the name CLUSTER_NAME.

      Variables:
        CLUSTER_NAME  Name of the cluster (default: cnpg-<k8s_version>).
    deps:
      - setup-dagger-engine
    silent: true
    vars:
      K8S_VERSION: '{{ regexReplaceAll "^v([0-9.]+).*" .KIND_NODE_TAG "$1" }}'
      CLUSTER_NAME: '{{ .CLUSTER_NAME | default (printf "cnpg-%s" .K8S_VERSION) }}'
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: container://{{ .DAGGER_ENGINE }}
    cmds:
      - >
        {{ .KIND_TOOLBOX }}
        with-exec --args="kind","delete","cluster","--name","{{ .CLUSTER_NAME }}" sync
    status:
      - >
        test "$({{ .KIND_TOOLBOX }}
        with-exec --args="sh","-c","kind get clusters 2>/dev/null | grep -qx {{ .CLUSTER_NAME }} && echo true || echo false" stdout)" = "false"

  teardown-container-registry:
    desc: Stop the local Docker registry if running
    silent: true
    cmds:
      - docker rm -fv {{ .REGISTRY_NAME }}
      - docker volume rm -f {{ .REGISTRY_CA_VOLUME }}
    status:
      - "! docker container inspect {{ .REGISTRY_NAME }} >/dev/null 2>&1"
      - "! docker volume inspect {{ .REGISTRY_CA_VOLUME }} >/dev/null 2>&1"

  teardown-docker-network:
    desc: Remove the Docker network if present
    silent: true
    cmds:
      - docker network rm {{ .REGISTRY_NETWORK }}
    status:
      - "! docker network inspect {{ .REGISTRY_NETWORK }} >/dev/null 2>&1"

  teardown-builder:
    desc: Delete builder container
    silent: true
    cmds:
      - docker buildx rm {{ .DOCKER_BUILDER }}
    status:
      - "! docker buildx inspect {{ .DOCKER_BUILDER }}"

  teardown-dagger-engine:
    desc: Delete the custom dagger engine container
    silent: true
    cmds:
      - docker rm -fv {{ .DAGGER_ENGINE }}
    status:
      - "! docker container inspect {{ .DAGGER_ENGINE }} >/dev/null 2>&1"
