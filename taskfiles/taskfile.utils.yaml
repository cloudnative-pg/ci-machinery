# renovate: datasource=github-tags depName=go-task/task versioning=semver
version: 3.54.0

vars:
  # renovate: datasource=docker depName=alpine/git versioning=docker
  GIT_IMAGE_VERSION: v2.52.0

tasks:
  checkout:
    desc: Clone a remote git repository into DEST_DIR
    summary: |
      Runs git inside a container, always making a fresh shallow clone
      of REPO_URL at REPO_REF, and exports it to DEST_DIR. The task
      fails if DEST_DIR exists and is not an empty directory.

      Configurable vars:
        REPO_URL      Required. HTTPS URL of the repository to clone.
        REPO_REF      Branch or tag to clone. Default: "main"
        DEST_DIR      Required. Local directory (relative to WORKDIR) the
                      clone is exported to. Created if missing; must
                      be empty if it exists.
        GITHUB_TOKEN  GitHub personal access token, for repositories with
                      restricted access. Passed to the container as a dagger
                      secret and never written to the checkout's git config.
                      Default: unset (anonymous access)
        WORKDIR       Directory where the task is executed.
                      Default: {{ .USER_WORKING_DIR }}
    deps:
      - infra:setup-dagger-engine
    vars:
      REPO_REF: '{{ .REPO_REF | default "main" }}'
      GITHUB_TOKEN_STEP: '{{ if .GITHUB_TOKEN }}with-secret-variable --name=GITHUB_TOKEN --secret=env://GITHUB_TOKEN{{ end }}'
      CHECKOUT_SCRIPT: >-
        set -eu;
        if [ -n "${GITHUB_TOKEN:-}" ]; then set -- -c "http.extraheader=Authorization: Basic $(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 | tr -d "\n")"; else set --; fi;
        git "$@" clone -q --depth 1 --branch "$REPO_REF" "$REPO_URL" .
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://{{ .DAGGER_ENGINE }}
      GITHUB_TOKEN: '{{ .GITHUB_TOKEN }}'
    requires:
      vars:
        - name: REPO_URL
        - name: DEST_DIR
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    preconditions:
      - sh: '[ ! -e {{ .DEST_DIR | shellQuote }} ] || { [ -d {{ .DEST_DIR | shellQuote }} ] && [ -z "$(ls -A {{ .DEST_DIR | shellQuote }})" ]; }'
        msg: "DEST_DIR '{{ .DEST_DIR }}' exists and is not an empty directory"
    cmds:
      - >
        dagger --progress plain core container
        from --address alpine/git:{{ .GIT_IMAGE_VERSION }}
        with-workdir --path /work
        with-env-variable --name=REPO_URL --value={{ .REPO_URL | shellQuote }}
        with-env-variable --name=REPO_REF --value={{ .REPO_REF | shellQuote }}
        with-env-variable --name=CACHEBUSTER --value="$(date)"
        {{ .GITHUB_TOKEN_STEP }}
        with-new-file --path /checkout.sh --contents={{ .CHECKOUT_SCRIPT | shellQuote }}
        with-exec --args=sh --args=/checkout.sh
        directory --path /work export --path {{ .DEST_DIR | shellQuote }} 
