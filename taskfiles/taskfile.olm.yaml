# renovate: datasource=github-tags depName=go-task/task versioning=semver
version: 3.54.0

includes:
  infra: "./taskfile.infra.yaml"

vars:
  # renovate: datasource=docker depName=busybox versioning=docker
  BUSYBOX_VERSION: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
  # renovate: datasource=docker depName=quay.io/operator-framework/operator-sdk versioning=docker
  OPERATOR_SDK_IMAGE_VERSION: v1.42.3@sha256:b7378eb179b97fbdf1ff1304e86f62e9ff9f9c2d0089464111ce8eddd39e2013
  # renovate: datasource=docker depName=quay.io/operator-framework/opm versioning=docker
  OPM_IMAGE_VERSION: v1.74.0@sha256:b32d3891616662620da08d7f0ec42c2e69fa2de43427dc975d35b12f7a969a0f
  # renovate: datasource=docker depName=alpine/kubectl versioning=docker
  KUBECTL_VERSION: 1.37.1@sha256:a5d0fbecab3f7b6c2ab7398f1daa73a3e0ed6ece18556d21698233e9e3759cc7
  # renovate: datasource=git-refs depName=https://github.com/redhat-openshift-ecosystem/community-operators-pipeline.git versioning=git currentValue=ci/latest
  OPP_SCRIPT_SHA: "06c8c50c3e7f60e155595ccc66764aa526e674fc"
  REGISTRY_CA_VOLUME: '{{ .REGISTRY_CA_VOLUME | default "cnpg-registry-tls" }}'
  REGISTRY_CA_PEM:
    sh: docker volume inspect {{ .REGISTRY_CA_VOLUME }} >/dev/null 2>&1 && docker run --rm -v {{ .REGISTRY_CA_VOLUME }}:/certs:ro busybox:{{ .BUSYBOX_VERSION }} cat /certs/ca.pem 2>/dev/null || true
  RHEL_CA_TRUST_STEP: '{{ if .REGISTRY_CA_PEM }}with-new-file --path /etc/pki/ca-trust/source/anchors/registry-ca.crt --contents={{ .REGISTRY_CA_PEM | shellQuote }} with-exec --args update-ca-trust{{ end }}'
  VERSION_REGEX: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(rc|dev)[1-9][0-9]*)?$'

tasks:
  bundle:generate:
    desc: Generate the OLM bundle via operator-sdk
    summary: |
      Runs `operator-sdk generate bundle` to produce the OLM bundle,
      then exports it together with bundle.Dockerfile as a single
      directory ready for `docker build`.
      This task requires the rendered OLM manifest to be available in
      the project's INPUT_DIR. It must not be confused with the plain
      olm manifest directory of the source project, which only contains
      the CSV.

      Configurable vars:
        PACKAGE_NAME     Required. Name of the OLM package (--package).
        INPUT_DIR        Directory containing the rendered manifests
                          (--input-dir). Default: "olm-manifests"
        CHANNELS         Comma-separated list of channels the bundle
                          belongs to (--channels). Default: "stable-v0"
        DEFAULT_CHANNEL  Channel set as the package's default
                          (--default-channel). Default: "stable-v0"
        EXTRA_ARGS       Additional raw arguments appended to
                          `operator-sdk generate bundle --manifests`
                          (e.g. --use-image-digests).
                          Must not set --package, --input-dir, --channels,
                          --version, --default-channel, --output-dir,
                          --manifests, or --metadata, since those are
                          already set by this task. Default: ""
        OUTPUT_DIR       Directory the bundle (manifests/, metadata/,
                          tests/, bundle.Dockerfile) is exported to.
                          Default: "olm-bundle"
        WORKDIR          Directory where the task is executed.
                          Default: {{ .USER_WORKING_DIR }}
    deps:
      - infra:setup-dagger-engine
    vars:
      INPUT_DIR: '{{ .INPUT_DIR | default "olm-manifests" }}'
      CHANNELS: '{{ .CHANNELS | default "stable-v0" }}'
      DEFAULT_CHANNEL: '{{ .DEFAULT_CHANNEL | default "stable-v0" }}'
      EXTRA_ARGS: '{{ .EXTRA_ARGS | default "" }}'
      OUTPUT_DIR: '{{ .OUTPUT_DIR | default "olm-bundle" }}'
      GIT_TAG_VERSION:
        sh: set -o pipefail && git describe --tags --match 'v*' | sed -e 's/^v//; s/-g[0-9a-f]\+$//; s/-\([0-9]\+\)$/-dev\1/'
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://{{ .DAGGER_ENGINE }}
    requires:
      vars:
        - name: PACKAGE_NAME
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    run: when_changed
    preconditions:
      - sh: 'test -d "{{ .INPUT_DIR }}"'
        msg: "INPUT_DIR '{{ .INPUT_DIR }}' does not exist"
      - sh: |
          case "{{ .EXTRA_ARGS }}" in
            *--package*|*--input-dir*|*--channels*|*--default-channel*|*--output-dir*|*--version*|*--manifests*|*--metadata*) exit 1 ;;
          esac
        msg: "EXTRA_ARGS must not set --package, --input-dir, --channels, --default-channel, --output-dir, --version, --manifests, or --metadata"
    cmds:
      # Manifests and metadata are generated in two separate steps: in a single
      # run with --input-dir, operator-sdk writes the scorecard config under
      # --output-dir but looks for it under --input-dir when generating the
      # metadata, so bundle.Dockerfile and annotations.yaml miss it.
      # See https://github.com/operator-framework/operator-sdk/issues/7144
      - >
        dagger --progress plain core container
        from --address quay.io/operator-framework/operator-sdk:{{ .OPERATOR_SDK_IMAGE_VERSION }}
        with-workdir --path /src
        with-directory --source ./ --path ./
        {{ .RHEL_CA_TRUST_STEP }}
        with-exec
        --args=sh --args=-c
        --args={{ printf "rm -rf bundle bundle.Dockerfile && operator-sdk generate bundle --manifests --package=%s --input-dir=%s --version=%s --output-dir=bundle %s < /dev/null" (.PACKAGE_NAME | shellQuote) (.INPUT_DIR | shellQuote) (.GIT_TAG_VERSION | shellQuote) .EXTRA_ARGS | replace "\"" "\"\"" | printf "\"%s\"" | shellQuote }}
        with-exec
        --args=sh --args=-c
        --args={{ printf "operator-sdk generate bundle --metadata --package=%s --input-dir=bundle --output-dir=bundle --channels=%s --default-channel=%s < /dev/null" (.PACKAGE_NAME | shellQuote) (.CHANNELS | shellQuote) (.DEFAULT_CHANNEL | shellQuote) | replace "\"" "\"\"" | printf "\"%s\"" | shellQuote }}
        with-exec
        --args=sh --args=-c --args='mkdir bundle-dist && mv bundle.Dockerfile bundle-dist && mv bundle bundle-dist'
        directory --path bundle-dist export --path {{ .OUTPUT_DIR | shellQuote }} --wipe

  bundle:image:
    desc: Build the OLM bundle image
    deps:
      - infra:setup-docker-builder
    summary: |
      Generates the OLM bundle image starting from a bundle directory.

      Configurable vars:
        IMAGE_NAME           Required. Repository name of the bundle image.
        BUNDLE_DIR           Directory holding the generated bundle and
                              bundle.Dockerfile.
                              Default: "olm-bundle".
        IMAGE_REGISTRY       Registry the image is tagged for and pushed to.
                              Default: "{{ .REGISTRY_NAME }}:{{ .REGISTRY_INTERNAL_PORT }}".
        IMAGE_TAG            Tag applied to the bundle image.
                              Default: "bundle".
        PLATFORMS            Comma-separated buildx target platforms.
                              Default: "linux/amd64,linux/arm64".
        WORKDIR              Directory where the task is executed.
                              Default: {{ .USER_WORKING_DIR }}
    vars:
      BUNDLE_DIR: '{{ .BUNDLE_DIR | default "olm-bundle" }}'
      IMAGE_REGISTRY: '{{ .IMAGE_REGISTRY | default (print .REGISTRY_NAME ":" .REGISTRY_INTERNAL_PORT) }}'
      IMAGE_TAG: '{{ .IMAGE_TAG | default "bundle" }}'
      PLATFORMS: '{{ .PLATFORMS | default "linux/amd64,linux/arm64" }}'
    requires:
      vars:
        - name: IMAGE_NAME
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    run: when_changed
    preconditions:
      - sh: 'test -d "{{ .BUNDLE_DIR }}"'
        msg: "BUNDLE_DIR '{{ .BUNDLE_DIR }}' does not exist"
    cmds:
      - >
        docker buildx build
        --builder {{ .DOCKER_BUILDER }}
        --platform {{ .PLATFORMS }}
        --tag {{ .IMAGE_REGISTRY }}/{{ .IMAGE_NAME }}:{{ .IMAGE_TAG }}
        -f {{ .BUNDLE_DIR }}/bundle.Dockerfile
        --push
        {{ .BUNDLE_DIR }}

  bundle:validate:
    desc: Validate the OLM bundle image via operator-sdk
    summary: |
      Runs `operator-sdk bundle validate` against the bundle image.

      Configurable vars:
        BUNDLE_IMAGE     Required. The bundle image.
        EXTRA_ARGS       Additional raw arguments appended to
                          `operator-sdk bundle validate`.
                          Example:
                          `--select-optional suite=operatorframework`.
                          Must not set `--alpha-select-external`,
                          `--image-builder` since those break
                          the expected behaviour of this task.
                          Default: ""
    deps:
      - infra:setup-dagger-engine
    vars:
      EXTRA_ARGS: '{{ .EXTRA_ARGS | default "" }}'
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://{{ .DAGGER_ENGINE }}
    requires:
      vars:
        - name: BUNDLE_IMAGE
    run: when_changed
    preconditions:
      - sh: |
          case "{{ .EXTRA_ARGS }}" in
            *--alpha-select-external*|*--image-builder*) exit 1 ;;
          esac
        msg: "EXTRA_ARGS must not set --alpha-select-external or --image-builder"
    cmds:
      - >
        dagger --progress plain core container
        from --address quay.io/operator-framework/operator-sdk:{{ .OPERATOR_SDK_IMAGE_VERSION }}
        {{ .RHEL_CA_TRUST_STEP }}
        with-exec
        --args='sh,-c,"operator-sdk bundle validate
        --image-builder=none
        {{ .BUNDLE_IMAGE }}
        {{ .EXTRA_ARGS }}"'
        stdout

  bundle:scorecard:
    desc: Run the Scorecard tests against the OLM bundle image via operator-sdk
    summary: |
      Runs `operator-sdk scorecard` against the bundle image on the
      Kubernetes cluster referenced by KUBECONFIG_PATH. The bundle must
      ship a Scorecard configuration (tests/scorecard/config.yaml).

      Configurable vars:
        BUNDLE_IMAGE     Required. The bundle image.
        KUBECONFIG_PATH  Required. Path to the kubeconfig of the target
                          cluster, relative to WORKDIR.
        EXTRA_ARGS       Additional raw arguments appended to
                          `operator-sdk scorecard`.
                          Example: `--selector=suite=basic --wait-time=120s`.
                          Default: ""
        WORKDIR          Directory where the task is executed.
                          Default: {{ .USER_WORKING_DIR }}
    deps:
      - infra:setup-dagger-engine
    vars:
      EXTRA_ARGS: '{{ .EXTRA_ARGS | default "" }}'
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://{{ .DAGGER_ENGINE }}
    requires:
      vars:
        - name: BUNDLE_IMAGE
        - name: KUBECONFIG_PATH
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    run: when_changed
    preconditions:
      - sh: 'test -f "{{ .KUBECONFIG_PATH }}"'
        msg: "KUBECONFIG_PATH '{{ .KUBECONFIG_PATH }}' does not exist"
      - sh: |
          case "{{ .EXTRA_ARGS }}" in
            *--kubeconfig*) exit 1 ;;
          esac
        msg: "EXTRA_ARGS must not set --kubeconfig"
    cmds:
      - >
        dagger --progress plain core container
        from --address quay.io/operator-framework/operator-sdk:{{ .OPERATOR_SDK_IMAGE_VERSION }}
        {{ .RHEL_CA_TRUST_STEP }}
        with-mounted-file --path /kubeconfig --source {{ .KUBECONFIG_PATH | shellQuote }}
        with-env-variable --name=CACHE_BUSTER --value="$(date)"
        with-exec
        --args=sh --args=-c
        --args={{ printf "operator-sdk scorecard --kubeconfig=/kubeconfig %s %s" (.BUNDLE_IMAGE | shellQuote) .EXTRA_ARGS | replace "\"" "\"\"" | printf "\"%s\"" | shellQuote }}
        stdout

  bundle:test-install:
    desc: Install the operator through OLM from the bundle image
          and verify the installation works
    summary: |
      Checks that the bundle is installable through OLM.

      Configurable vars:
        BUNDLE_IMAGE        Required. The bundle image to install.
        KUBECONFIG_PATH     Required. Path of the kubeconfig file of the
                             cluster to install the operator in.
        PACKAGE_NAME        Required. Name of the operator's OLM package.
        SKIP_DELETE         When "true", the operator is left installed.
                             Default: "false"
        WORKDIR             Directory where the task is executed.
                             Default: {{ .USER_WORKING_DIR }}
    vars:
      CATALOG_DIR:
        sh: mktemp -d
      # Replace the bundle image's tag, and digest if any, with the "catalog" tag
      CATALOG_IMAGE: '{{ regexReplaceAll ":[^/]*$" .BUNDLE_IMAGE "" }}:catalog'
      SKIP_DELETE: '{{ .SKIP_DELETE | default "false" }}'
    requires:
      vars:
        - name: BUNDLE_IMAGE
        - name: PACKAGE_NAME
        - name: KUBECONFIG_PATH
        - name: SKIP_DELETE
          enum: ["true", "false"]
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    cmds:
      - defer: rm -rf {{ .CATALOG_DIR | shellQuote }}
      - task: catalog:generate
        vars:
          BUNDLE_IMAGE: '{{ .BUNDLE_IMAGE }}'
          OUTPUT_DIR: '{{ .CATALOG_DIR }}'
      - task: catalog:image
        vars:
          CATALOG_IMAGE: '{{ .CATALOG_IMAGE }}'
          CATALOG_DIR: '{{ .CATALOG_DIR }}'
      - task: catalog:install
        vars:
          CATALOG_IMAGE: '{{ .CATALOG_IMAGE }}'
          PACKAGE_NAME: '{{ .PACKAGE_NAME }}'
          KUBECONFIG_PATH: '{{ .KUBECONFIG_PATH }}'
          NAMESPACE: '{{ .NAMESPACE }}'
          WORKDIR: '{{ .WORKDIR }}'
      - task: catalog:uninstall
        if: '[ "{{ .SKIP_DELETE }}" != "true" ]'
        vars:
          PACKAGE_NAME: '{{ .PACKAGE_NAME }}'
          KUBECONFIG_PATH: '{{ .KUBECONFIG_PATH }}'
          WORKDIR: '{{ .WORKDIR }}'

  bundle:fruit-tests:
    desc: Run the OperatorHub fruit tests (kiwi, lemon, orange) against an OLM bundle
    summary: |
      Downloads the OperatorHub pipeline script (opp.sh), pinned to
      OPP_SCRIPT_SHA, and runs the kiwi, lemon and orange tests
      against a bundle.
      See https://k8s-operatorhub.github.io/community-operators/operator-test-suite/

      This task only runs inside a GitHub Actions runner:
      opp.sh changes the machine it runs on, so it should only be executed
      in ephemeral environments.

      Configurable vars:
        BUNDLE_PATH          Required. Path to the bundle directory, laid
                              out as `<dir>/operators/<OPERATOR_NAME>/<VERSION>`,
                              e.g. in the checkout prepared by `operator-hub:add`.
        OPP_PRODUCTION_TYPE  Target platform of the tests: "k8s", "ocp"
                              or "okd". Default: "k8s"
        WORKDIR              Directory where the task is executed.
                              Default: {{ .USER_WORKING_DIR }}
    vars:
      OPP_PRODUCTION_TYPE: '{{ .OPP_PRODUCTION_TYPE | default "k8s" }}'
      OPP_SCRIPT:
        sh: mktemp -u
    env:
      OPP_DEBUG: 1
      OPP_PRODUCTION_TYPE: '{{ .OPP_PRODUCTION_TYPE }}'
      OPP_CONTAINER_OPT: -t
      OPP_AUTO_PACKAGEMANIFEST_CLUSTER_VERSION_LABEL: 1
      OPP_RELEASE_INDEX_NAME: catalog_tmp
    requires:
      vars:
        - name: BUNDLE_PATH
        - name: OPP_PRODUCTION_TYPE
          enum: [ k8s, ocp, okd ]
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    preconditions:
      - sh: '[ "${GITHUB_ACTIONS:-}" = "true" ]'
        msg: "bundle:fruit-tests only runs inside a GitHub Actions runner: opp.sh modifies the host it runs on"
      - sh: 'test -d {{ printf "%s/manifests" .BUNDLE_PATH | shellQuote }} && test -d {{ printf "%s/metadata" .BUNDLE_PATH | shellQuote }}'
        msg: "BUNDLE_PATH '{{ .BUNDLE_PATH }}' must contain the manifests/ and metadata/ directories"
      # opp.sh takes the operator name and version from the path
      - sh: 'test "$(basename "$(dirname "$(dirname "$(readlink -f {{ .BUNDLE_PATH | shellQuote }})")")")" = operators'
        msg: "BUNDLE_PATH '{{ .BUNDLE_PATH }}' must be laid out as <dir>/operators/<OPERATOR_NAME>/<VERSION>"
    cmds:
      - defer: rm -f {{ .OPP_SCRIPT | shellQuote }}
      - |
        if [ -n "${GITHUB_TOKEN:-}" ]; then set -- -H "Authorization: Bearer ${GITHUB_TOKEN}"; else set --; fi
        curl "$@" --retry 5 --retry-delay 2 -fsSL -o {{ .OPP_SCRIPT | shellQuote }} \
          "https://raw.githubusercontent.com/redhat-openshift-ecosystem/community-operators-pipeline/{{ .OPP_SCRIPT_SHA }}/ci/scripts/opp.sh"
      - bash {{ .OPP_SCRIPT | shellQuote }} kiwi,lemon,orange {{ .BUNDLE_PATH | shellQuote }}

  olm-operator:setup:
    desc: Install OLM on a Kubernetes cluster via operator-sdk
    summary: |
      Runs `operator-sdk olm install` against the Kubernetes cluster
      referenced by KUBECONFIG_PATH.

      Configurable vars:
        KUBECONFIG_PATH  Required. Path of the kubeconfig file of the
                          cluster to install OLM in.
        EXTRA_ARGS       Additional raw arguments appended to
                          `operator-sdk olm install`.
                          Example: `--version=0.28.0 --timeout=5m`.
                          Default: ""
        WORKDIR          Directory where the task is executed.
                          Default: {{ .USER_WORKING_DIR }}
    deps:
      - infra:setup-dagger-engine
    vars:
      EXTRA_ARGS: '{{ .EXTRA_ARGS | default "" }}'
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://{{ .DAGGER_ENGINE }}
    requires:
      vars:
        - name: KUBECONFIG_PATH
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    preconditions:
      - sh: 'test -f "{{ .KUBECONFIG_PATH }}"'
        msg: "KUBECONFIG_PATH '{{ .KUBECONFIG_PATH }}' does not exist"
    cmds:
      - >
        dagger --progress plain core container
        from --address quay.io/operator-framework/operator-sdk:{{ .OPERATOR_SDK_IMAGE_VERSION }}
        with-mounted-file --path /root/.kube/config --source {{ .KUBECONFIG_PATH | shellQuote }}
        with-env-variable --name=CACHE_BUSTER --value="$(date)"
        with-exec
        --args=sh --args=-c
        --args={{ printf "operator-sdk olm install %s" .EXTRA_ARGS | replace "\"" "\"\"" | printf "\"%s\"" | shellQuote }}
        stdout
    status:
      - >
        dagger --progress plain core container
        from --address quay.io/operator-framework/operator-sdk:{{ .OPERATOR_SDK_IMAGE_VERSION }}
        with-mounted-file --path /root/.kube/config --source {{ .KUBECONFIG_PATH | shellQuote }}
        with-env-variable --name=CACHE_BUSTER --value="$(date)"
        with-exec --args=olm,status --use-entrypoint
        sync

  olm-operator:teardown:
    desc: Uninstall OLM from a Kubernetes cluster via operator-sdk
    summary: |
      Runs `operator-sdk olm uninstall` against the Kubernetes cluster
      referenced by KUBECONFIG_PATH. Does nothing if OLM is not installed.

      Configurable vars:
        KUBECONFIG_PATH  Required. Path of the kubeconfig file of the
                          cluster to uninstall OLM from.
        EXTRA_ARGS       Additional raw arguments appended to
                          `operator-sdk olm uninstall`.
                          Example: `--version=0.28.0 --timeout=5m`.
                          Default: ""
        WORKDIR          Directory where the task is executed.
                          Default: {{ .USER_WORKING_DIR }}
    deps:
      - infra:setup-dagger-engine
    vars:
      EXTRA_ARGS: '{{ .EXTRA_ARGS | default "" }}'
      SKIP_IF_NOT_INSTALLED: >-
        operator-sdk olm status >/dev/null 2>&1 ||
        { echo OLM is not installed, nothing to do; exit 0; };
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://{{ .DAGGER_ENGINE }}
    requires:
      vars:
        - name: KUBECONFIG_PATH
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    preconditions:
      - sh: 'test -f "{{ .KUBECONFIG_PATH }}"'
        msg: "KUBECONFIG_PATH '{{ .KUBECONFIG_PATH }}' does not exist"
    cmds:
      - >
        dagger --progress plain core container
        from --address quay.io/operator-framework/operator-sdk:{{ .OPERATOR_SDK_IMAGE_VERSION }}
        with-mounted-file --path /root/.kube/config --source {{ .KUBECONFIG_PATH | shellQuote }}
        with-env-variable --name=CACHE_BUSTER --value="$(date)"
        with-exec
        --args=sh --args=-c
        --args={{ printf "%s operator-sdk olm uninstall %s" .SKIP_IF_NOT_INSTALLED .EXTRA_ARGS | replace "\"" "\"\"" | printf "\"%s\"" | shellQuote }}
        stdout

  catalog:generate:
    desc: Generate an ephemeral OLM catalog containing only the bundle
    internal: true
    deps:
      - infra:setup-dagger-engine
    vars:
      OPM_IMAGE: quay.io/operator-framework/opm:{{ .OPM_IMAGE_VERSION }}
      CATALOG_TEMPLATE: |
        schema: olm.semver
        GenerateMajorChannels: true
        GenerateMinorChannels: false
        Stable:
          Bundles:
            - Image: {{ .BUNDLE_IMAGE }}
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://{{ .DAGGER_ENGINE }}
    requires:
      vars:
        - name: BUNDLE_IMAGE
        - name: OUTPUT_DIR
    run: when_changed
    cmds:
      - >
        dagger --progress plain core container
        from --address {{ .OPM_IMAGE }}
        with-new-file --path /etc/containers/policy.json
        --contents='{"default": [{"type": "insecureAcceptAnything"}]}'
        with-new-file --path /tmp/catalog-template.yaml --contents={{ .CATALOG_TEMPLATE | shellQuote }}
        with-workdir --path /work
        with-exec --args=mkdir,-p,configs/operator
        with-exec --args=opm,generate,dockerfile,configs,--base-image,{{ .OPM_IMAGE }},--builder-image,{{ .OPM_IMAGE }}
        with-exec --args=opm,alpha,render-template,semver,--skip-tls-verify,-o,yaml,/tmp/catalog-template.yaml
        --redirect-stdout=/work/configs/operator/catalog.yaml
        with-exec --args=opm,validate,configs
        with-exec --args=chmod,-R,a+rX,/work
        directory --path /work
        export --path {{ .OUTPUT_DIR | shellQuote }} --wipe

  catalog:image:
    desc: Build the OLM catalog image
    deps:
      - infra:setup-docker-builder
    internal: true
    vars:
      PLATFORMS: '{{ .PLATFORMS | default "linux/amd64,linux/arm64" }}'
    requires:
      vars:
        - name: CATALOG_IMAGE
        - name: CATALOG_DIR
    run: when_changed
    preconditions:
      - sh: 'test -f "{{ .CATALOG_DIR }}/configs.Dockerfile"'
        msg: "CATALOG_DIR '{{ .CATALOG_DIR }}' does not contain configs.Dockerfile"
    cmds:
      - >
        docker buildx build
        --builder {{ .DOCKER_BUILDER }}
        --platform {{ .PLATFORMS }}
        --tag {{ .CATALOG_IMAGE }}
        -f {{ .CATALOG_DIR }}/configs.Dockerfile
        --push
        {{ .CATALOG_DIR }}

  catalog:install:
    desc: Install the operator through OLM from a catalog image
    deps:
      - infra:setup-dagger-engine
    internal: true
    vars:
      NAMESPACE: '{{ .NAMESPACE | default "operators" }}'
      TIMEOUT: '{{ .TIMEOUT | default "2m" }}'
      CATALOG_SOURCE: |
        apiVersion: operators.coreos.com/v1alpha1
        kind: CatalogSource
        metadata:
          name: operators
          namespace: {{ .NAMESPACE }}
        spec:
          sourceType: grpc
          image: {{ .CATALOG_IMAGE }}
          grpcPodConfig:
            securityContextConfig: restricted
      SUBSCRIPTION: |
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: operator
          namespace: {{ .NAMESPACE }}
        spec:
          name: {{ .PACKAGE_NAME }}
          source: operators
          sourceNamespace: {{ .NAMESPACE }}
          installPlanApproval: Automatic
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://{{ .DAGGER_ENGINE }}
    requires:
      vars:
        - name: CATALOG_IMAGE
        - name: PACKAGE_NAME
        - name: KUBECONFIG_PATH
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    preconditions:
      - sh: 'test -f "{{ .KUBECONFIG_PATH }}"'
        msg: "KUBECONFIG_PATH '{{ .KUBECONFIG_PATH }}' does not exist"
    cmds:
      - >
        dagger --progress plain core container
        from --address alpine/kubectl:{{ .KUBECTL_VERSION }}
        with-new-file --path /root/.kube/config --contents="$(cat {{ .KUBECONFIG_PATH | shellQuote }})"
        with-new-file --path /manifests/catalog-source.yaml --contents={{ .CATALOG_SOURCE | shellQuote }}
        with-new-file --path /manifests/subscription.yaml --contents={{ .SUBSCRIPTION | shellQuote }}
        with-env-variable --name=CACHEBUSTER --value="$(date)"
        with-exec --args=apply,-f,/manifests --use-entrypoint
        sync
      # Wait for the CSV to get healthy
      - >
        dagger --progress plain core container
        from --address alpine/kubectl:{{ .KUBECTL_VERSION }}
        with-new-file --path /root/.kube/config --contents="$(cat {{ .KUBECONFIG_PATH | shellQuote }})"
        with-env-variable --name=CACHEBUSTER --value="$(date)"
        with-exec --args=wait,-n,{{ .NAMESPACE }},--timeout={{ .TIMEOUT }},subscription/operator,--for=jsonpath={.status.installedCSV}
        --use-entrypoint
        with-exec --args=sh --args=-c
        --args='kubectl wait -n {{ .NAMESPACE }} --timeout={{ .TIMEOUT }}
        csv/$(kubectl get -n {{ .NAMESPACE }} subscription/operator -o jsonpath={.status.installedCSV})
        --for=jsonpath={.status.phase}=Succeeded'
        sync

  catalog:uninstall:
    desc: Uninstall the operator installed by `catalog:install`
    deps:
      - infra:setup-dagger-engine
    internal: true
    vars:
      NAMESPACE: '{{ .NAMESPACE | default "operators" }}'
      TIMEOUT: '{{ .TIMEOUT | default "1m" }}'
      OPERATOR_LABEL: operators.coreos.com/{{ .PACKAGE_NAME }}.{{ .NAMESPACE }}
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://{{ .DAGGER_ENGINE }}
    requires:
      vars:
        - name: PACKAGE_NAME
        - name: KUBECONFIG_PATH
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    preconditions:
      - sh: 'test -f "{{ .KUBECONFIG_PATH }}"'
        msg: "KUBECONFIG_PATH '{{ .KUBECONFIG_PATH }}' does not exist"
    cmds:
      - >
        dagger --progress plain core container
        from --address alpine/kubectl:{{ .KUBECTL_VERSION }}
        with-new-file --path /root/.kube/config --contents="$(cat {{ .KUBECONFIG_PATH | shellQuote }})"
        with-env-variable --name=CACHEBUSTER --value="$(date)"
        with-exec --args=delete,-n,{{ .NAMESPACE }},subscription/operator,--ignore-not-found,--timeout={{ .TIMEOUT }}
        --use-entrypoint
        with-exec --args=delete,-n,{{ .NAMESPACE }},csv,-l,{{ .OPERATOR_LABEL }},--ignore-not-found,--timeout={{ .TIMEOUT }}
        --use-entrypoint
        with-exec --args=delete,-n,{{ .NAMESPACE }},catalogsource/operators,--ignore-not-found,--timeout={{ .TIMEOUT }}
        --use-entrypoint
        sync

  operator-hub:clone:
    desc: Clone the community-operators project to a local directory
    summary: |
      Clones https://github.com/k8s-operatorhub/community-operators to a
      local directory.

      Configurable vars:
        COMMUNITY_OPERATORS_PATH  Directory the project is cloned into.
                     Default: "community-operators"
        WORKDIR     Directory where the task is executed.
                     Default: {{ .USER_WORKING_DIR }}
    vars:
      COMMUNITY_OPERATORS_PATH: '{{ .COMMUNITY_OPERATORS_PATH | default "community-operators" }}'
      COMMUNITY_OPERATORS_REPO: 'https://github.com/k8s-operatorhub/community-operators.git'
      COMMUNITY_OPERATORS_BRANCH: 'main'
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    cmds:
      - git clone --single-branch --no-tags --branch {{ .COMMUNITY_OPERATORS_BRANCH }} {{ .COMMUNITY_OPERATORS_REPO }} {{ .COMMUNITY_OPERATORS_PATH | shellQuote }}
    status:
      - test "$(git -C {{ .COMMUNITY_OPERATORS_PATH | shellQuote }} config --get remote.origin.url 2>/dev/null)" = {{ .COMMUNITY_OPERATORS_REPO }}

  operator-hub:add:
    desc: Add a new bundle to the community-operator project for an operator
    summary: |
      Copies an OLM bundle into `operators/<OPERATOR_NAME>/<VERSION>/` of a
      local checkout of
      https://github.com/cloudnative-pg/community-operators.

      Configurable vars:
        OPERATOR_NAME            Required. Name of the operator.
        VERSION                  Required. Bundle version, as a release
                                  (major.minor.patch), a release
                                  candidate (major.minor.patch-rcN) or a
                                  development build (major.minor.patch-devN).
        BUNDLE_DIR               Directory containing the bundle
                                  `manifests/` and `metadata/` directories.
                                  Default: "olm-bundle/bundle"
        COMMUNITY_OPERATORS_PATH  Path to the community-operators checkout.
                                  Default: "community-operators"
        WORKDIR                  Directory where the task is executed.
                                  Default: {{ .USER_WORKING_DIR }}
    vars:
      BUNDLE_DIR: '{{ .BUNDLE_DIR | default "olm-bundle/bundle" }}'
      COMMUNITY_OPERATORS_PATH: '{{ .COMMUNITY_OPERATORS_PATH | default "community-operators" }}'
      OPERATOR_DIR: '{{ .COMMUNITY_OPERATORS_PATH }}/operators/{{ .OPERATOR_NAME }}'
      VERSION_DIR: '{{ .OPERATOR_DIR }}/{{ .VERSION }}'
    requires:
      vars:
        - name: OPERATOR_NAME
        - name: VERSION
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    preconditions:
      - sh: 'echo {{ .VERSION | shellQuote }} | grep -Eq {{ .VERSION_REGEX | shellQuote }}'
        msg: "VERSION '{{ .VERSION }}' must be a release (major.minor.patch), a release candidate (major.minor.patch-rcN) or a development build (major.minor.patch-devN)"
      - sh: 'test -d "{{ .COMMUNITY_OPERATORS_PATH }}/operators"'
        msg: "COMMUNITY_OPERATORS_PATH '{{ .COMMUNITY_OPERATORS_PATH }}' is not a community-operators checkout (no operators/ directory)"
      - sh: 'test -d {{ printf "%s/manifests" .BUNDLE_DIR | shellQuote }} && test -d {{ printf "%s/metadata" .BUNDLE_DIR | shellQuote }}'
        msg: "BUNDLE_DIR '{{ .BUNDLE_DIR }}' must contain the manifests/ and metadata/ directories"
      - sh: '! test -e {{ .VERSION_DIR | shellQuote }}'
        msg: "Version directory '{{ .VERSION_DIR }}' already exists"
    cmds:
      - mkdir -p {{ .VERSION_DIR | shellQuote }}
      - cp -R {{ printf "%s/manifests" .BUNDLE_DIR | shellQuote }} {{ printf "%s/metadata" .BUNDLE_DIR | shellQuote }} {{ .VERSION_DIR | shellQuote }}

  operator-hub:pull-request:
    desc: Open a pull request for a new operator version on community-operators
    summary: |
      Automates the process of opening a pull request for a new operator version
      registered on a local community-operators checkout, to be merged into the upstream
      https://github.com/k8s-operatorhub/community-operators.

      Requires the GITHUB_TOKEN environment variable to hold a GitHub
      token allowed to open pull requests on the upstream repository.

      Configurable vars:
        OPERATOR_NAME            Required. Name of the operator.
        VERSION                  Required. Version being released, in the
                                  major.minor.patch format.
        COMMUNITY_OPERATOR_PATH  Path to the community-operators checkout.
                                  Default: "community-operators"
        FORK_REPO_URL            URL of the community-operators fork the
                                  branch is pushed to.
                                  Default: "https://github.com/cloudnative-pg/community-operators.git"
        WORKDIR                  Directory where the task is executed.
                                  Default: {{ .USER_WORKING_DIR }}
    deps:
      - infra:setup-dagger-engine
    vars:
      COMMUNITY_OPERATOR_PATH: '{{ .COMMUNITY_OPERATOR_PATH | default "community-operators" }}'
      FORK_REPO_URL: '{{ .FORK_REPO_URL | default "https://github.com/cloudnative-pg/community-operators.git" }}'
      FORK_OWNER: '{{ regexReplaceAll "^.*github\\.com[:/]([^/]+)/.*$" .FORK_REPO_URL "${1}" }}'
      UPSTREAM_REPO: 'k8s-operatorhub/community-operators'
      UPSTREAM_BRANCH: 'main'
      OPERATOR_SUBDIR: 'operators/{{ .OPERATOR_NAME }}'
      BRANCH: 'release-{{ .OPERATOR_NAME }}-{{ .VERSION }}'
      COMMIT_MESSAGE: 'operator {{ .OPERATOR_NAME }} ({{ .VERSION }})'
      GIT_CREDENTIAL_HELPER: '!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f'
      PR_TEMPLATE: '{{ .COMMUNITY_OPERATOR_PATH }}/docs/pull_request_template.md'
      PR_SCRIPT: |
        set -eu
        apk add --quiet --no-cache github-cli
        sed 's/\[ \]/[x]/g' /pr/template.md > /pr/body.md
        gh pr create --repo "$PR_REPO" --base "$PR_BASE" --head "$PR_HEAD" \
          --title "$PR_TITLE" --body-file /pr/body.md
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://{{ .DAGGER_ENGINE }}
    requires:
      vars:
        - name: OPERATOR_NAME
        - name: VERSION
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    preconditions:
      - sh: 'test -n "${GITHUB_TOKEN:-}"'
        msg: "The GITHUB_TOKEN environment variable is not set"
      - sh: 'echo {{ .FORK_OWNER | shellQuote }} | grep -Eq "^[A-Za-z0-9-]+$"'
        msg: "FORK_REPO_URL '{{ .FORK_REPO_URL }}' is not a GitHub repository URL"
      - sh: 'test -f {{ .PR_TEMPLATE | shellQuote }}'
        msg: "Pull request template '{{ .PR_TEMPLATE }}' does not exist"
      - sh: 'echo {{ .VERSION | shellQuote }} | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+$"'
        msg: "VERSION '{{ .VERSION }}' is not in the major.minor.patch format"
      - sh: 'git -C {{ .COMMUNITY_OPERATOR_PATH | shellQuote }} rev-parse --git-dir >/dev/null 2>&1'
        msg: "COMMUNITY_OPERATOR_PATH '{{ .COMMUNITY_OPERATOR_PATH }}' is not a git repository"
      - sh: 'test -d {{ printf "%s/%s/%s" .COMMUNITY_OPERATOR_PATH .OPERATOR_SUBDIR .VERSION | shellQuote }}'
        msg: "Version directory '{{ .COMMUNITY_OPERATOR_PATH }}/{{ .OPERATOR_SUBDIR }}/{{ .VERSION }}' does not exist"
      - sh: '! git -C {{ .COMMUNITY_OPERATOR_PATH | shellQuote }} rev-parse --verify --quiet {{ printf "refs/heads/%s" .BRANCH | shellQuote }} >/dev/null'
        msg: "Branch '{{ .BRANCH }}' already exists in '{{ .COMMUNITY_OPERATOR_PATH }}'"
      - sh: 'test -n "$(git -C {{ .COMMUNITY_OPERATOR_PATH | shellQuote }} status --porcelain -- {{ .OPERATOR_SUBDIR | shellQuote }})"'
        msg: "No changes to commit in '{{ .COMMUNITY_OPERATOR_PATH }}/{{ .OPERATOR_SUBDIR }}'"
    cmds:
      - git -C {{ .COMMUNITY_OPERATOR_PATH | shellQuote }} switch -c {{ .BRANCH | shellQuote }}
      - git -C {{ .COMMUNITY_OPERATOR_PATH | shellQuote }} add -- {{ .OPERATOR_SUBDIR | shellQuote }}
      - git -C {{ .COMMUNITY_OPERATOR_PATH | shellQuote }} commit -s -m {{ .COMMIT_MESSAGE | shellQuote }} -- {{ .OPERATOR_SUBDIR | shellQuote }}
      # The empty credential.helper resets the helper list, dropping helpers
      # from lower-priority configs, see
      # https://git-scm.com/docs/gitcredentials#_configuration_options
      - >
        git -C {{ .COMMUNITY_OPERATOR_PATH | shellQuote }}
        -c credential.helper=
        -c credential.helper={{ .GIT_CREDENTIAL_HELPER | shellQuote }}
        push {{ .FORK_REPO_URL | shellQuote }} {{ .BRANCH | shellQuote }}
      - >
        dagger --progress plain core container
        from --address {{ .ALPINE_IMAGE }}
        with-mounted-file --path /pr/template.md --source {{ .PR_TEMPLATE | shellQuote }}
        with-new-file --path /pr/open.sh --contents={{ .PR_SCRIPT | shellQuote }}
        with-env-variable --name=PR_REPO --value={{ .UPSTREAM_REPO }}
        with-env-variable --name=PR_TITLE --value={{ .COMMIT_MESSAGE | shellQuote }}
        with-env-variable --name=PR_HEAD --value={{ printf "%s:%s" .FORK_OWNER .BRANCH | shellQuote }}
        with-env-variable --name=PR_BASE --value={{ .UPSTREAM_BRANCH }}
        with-env-variable --name=GH_PROMPT_DISABLED --value=1
        with-env-variable --name=CACHE_BUSTER --value="$(date)"
        with-secret-variable --name=GH_TOKEN --secret=env://GITHUB_TOKEN
        with-exec --args=sh --args=/pr/open.sh
        stdout

  operator-hub:fruit-tests:
    desc: Run the OperatorHub fruit tests against a bundle
    summary: |
      Runs the OperatorHub fruit tests (kiwi, lemon, orange) against the
      bundle.
      See https://k8s-operatorhub.github.io/community-operators/operator-test-suite/

      Configurable vars:
        OPERATOR_NAME  Required. Name of the operator.
        VERSION        Required. Bundle version, as a release
                        (major.minor.patch), a release candidate
                        (major.minor.patch-rcN) or a development build
                        (major.minor.patch-devN).
        BUNDLE_DIR     Directory containing the bundle `manifests/` and
                        `metadata/` directories.
                        Default: "olm-bundle/bundle"
        WORKDIR        Directory where the task is executed.
                        Default: {{ .USER_WORKING_DIR }}
    vars:
      BUNDLE_DIR: '{{ .BUNDLE_DIR | default "olm-bundle/bundle" }}'
      TMP_DIR:
        sh: mktemp -d -u
      COMMUNITY_OPERATORS_PATH: '{{ .TMP_DIR }}/community-operators'
    requires:
      vars:
        - name: OPERATOR_NAME
        - name: VERSION
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    preconditions:
      - sh: '[ "${GITHUB_ACTIONS:-}" = "true" ]'
        msg: "operator-hub:fruit-tests only runs inside a GitHub Actions runner: opp.sh modifies the host it runs on"
      - sh: 'echo {{ .VERSION | shellQuote }} | grep -Eq {{ .VERSION_REGEX | shellQuote }}'
        msg: "VERSION '{{ .VERSION }}' must be a release (major.minor.patch), a release candidate (major.minor.patch-rcN) or a development build (major.minor.patch-devN)"
      - sh: 'test -d {{ printf "%s/manifests" .BUNDLE_DIR | shellQuote }} && test -d {{ printf "%s/metadata" .BUNDLE_DIR | shellQuote }}'
        msg: "BUNDLE_DIR '{{ .BUNDLE_DIR }}' must contain the manifests/ and metadata/ directories"
    cmds:
      - defer: rm -rf {{ .TMP_DIR | shellQuote }}
      - task: operator-hub:clone
        vars:
          COMMUNITY_OPERATORS_PATH: '{{ .COMMUNITY_OPERATORS_PATH }}'
          WORKDIR: '{{ .WORKDIR }}'
      - task: operator-hub:add
        vars:
          OPERATOR_NAME: '{{ .OPERATOR_NAME }}'
          VERSION: '{{ .VERSION }}'
          BUNDLE_DIR: '{{ .BUNDLE_DIR }}'
          COMMUNITY_OPERATORS_PATH: '{{ .COMMUNITY_OPERATORS_PATH }}'
          WORKDIR: '{{ .WORKDIR }}'
      - task: bundle:fruit-tests
        vars:
          BUNDLE_PATH: '{{ .COMMUNITY_OPERATORS_PATH }}/operators/{{ .OPERATOR_NAME }}/{{ .VERSION }}'
          WORKDIR: '{{ .WORKDIR }}'
