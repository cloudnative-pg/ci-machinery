# renovate: datasource=github-tags depName=go-task/task versioning=semver
version: 3.54.0

includes:
  infra: "./taskfile.infra.yaml"

vars:
  # renovate: datasource=docker depName=quay.io/operator-framework/operator-sdk versioning=docker
  OPERATOR_SDK_IMAGE_VERSION: v1.42.3@sha256:b7378eb179b97fbdf1ff1304e86f62e9ff9f9c2d0089464111ce8eddd39e2013
  REGISTRY_CA_VOLUME: '{{ .REGISTRY_CA_VOLUME | default "cnpg-registry-tls" }}'
  REGISTRY_CA_PEM:
    sh: docker run --rm -v {{ .REGISTRY_CA_VOLUME }}:/certs busybox cat /certs/ca.pem 2>/dev/null || true
  RHEL_CA_TRUST_STEP: '{{ if .REGISTRY_CA_PEM }}with-new-file --path /etc/pki/ca-trust/source/anchors/registry-ca.crt --contents={{ .REGISTRY_CA_PEM | shellQuote }} with-exec --args update-ca-trust{{ end }}'

tasks:
  bundle:generate:
    desc: Generate the OLM bundle via operator-sdk
    summary: |
      Runs `operator-sdk generate bundle` to produce the OLM bundle,
      then exports it together with bundle.Dockerfile as a single
      directory ready for `docker build`.
      This task requires the rendered OLM manifest to be available in
      the project's INPUT_DIR. It must not be confused with the plain
      olm manifest directory of the source project, which only contains
      the CSV.

      Configurable vars:
        PACKAGE_NAME     Required. Name of the OLM package (--package).
        INPUT_DIR        Directory containing the rendered manifests
                          (--input-dir). Default: "olm-manifests"
        CHANNELS         Comma-separated list of channels the bundle
                          belongs to (--channels). Default: "stable-v0"
        DEFAULT_CHANNEL  Channel set as the package's default
                          (--default-channel). Default: "stable-v0"
        EXTRA_ARGS       Additional raw arguments appended to
                          `operator-sdk generate bundle`. Must not set
                          --package, --input-dir, --channels, --version,
                          --default-channel, or --output-dir, since those
                          are already set by this task. Default: ""
        OUTPUT_DIR       Directory the bundle (manifests/, metadata/,
                          bundle.Dockerfile) is exported to. Default:
                          "olm-bundle"
        WORKDIR          Directory where the task is executed.
                          Default: {{ .USER_WORKING_DIR }}
    deps:
      - infra:setup-dagger-engine
    vars:
      INPUT_DIR: '{{ .INPUT_DIR | default "olm-manifests" }}'
      CHANNELS: '{{ .CHANNELS | default "stable-v0" }}'
      DEFAULT_CHANNEL: '{{ .DEFAULT_CHANNEL | default "stable-v0" }}'
      EXTRA_ARGS: '{{ .EXTRA_ARGS | default "" }}'
      OUTPUT_DIR: '{{ .OUTPUT_DIR | default "olm-bundle" }}'
      GIT_TAG_VERSION:
        sh: set -o pipefail && git describe --tags --match 'v*' | sed -e 's/^v//; s/-g[0-9a-f]\+$//; s/-\([0-9]\+\)$/-dev\1/'
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://{{ .DAGGER_ENGINE }}
    requires:
      vars:
        - name: PACKAGE_NAME
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    run: when_changed
    preconditions:
      - sh: 'test -d "{{ .INPUT_DIR }}"'
        msg: "INPUT_DIR '{{ .INPUT_DIR }}' does not exist"
      - sh: |
          case "{{ .EXTRA_ARGS }}" in
            *--package*|*--input-dir*|*--channels*|*--default-channel*|*--output-dir*|*--version*) exit 1 ;;
          esac
        msg: "EXTRA_ARGS must not set --package, --input-dir, --channels, --default-channel, --output-dir, or --version"
    cmds:
      - >
        dagger --progress plain core container
        from --address quay.io/operator-framework/operator-sdk:{{ .OPERATOR_SDK_IMAGE_VERSION }}
        with-workdir --path /src
        with-directory --source ./ --path ./
        {{ .RHEL_CA_TRUST_STEP }}
        with-exec
        --args=sh --args=-c
        --args={{ printf "rm -rf bundle bundle.Dockerfile && operator-sdk generate bundle --package=%s --input-dir=%s --channels=%s --default-channel=%s --version=%s --output-dir=bundle %s < /dev/null" (.PACKAGE_NAME | shellQuote) (.INPUT_DIR | shellQuote) (.CHANNELS | shellQuote) (.DEFAULT_CHANNEL | shellQuote) (.GIT_TAG_VERSION | shellQuote) .EXTRA_ARGS | replace "\"" "\"\"" | printf "\"%s\"" | shellQuote }}
        with-exec
        --args=sh --args=-c --args='mkdir bundle-dist && mv bundle.Dockerfile bundle-dist && mv bundle bundle-dist'
        directory --path bundle-dist export --path {{ .OUTPUT_DIR | shellQuote }} --wipe

  bundle:image:
    desc: Build the OLM bundle image
    deps:
      - infra:setup-dagger-engine
      - infra:setup-docker-builder
    summary: |
      Generates the OLM bundle image starting from a bundle directory.

      Configurable vars:
        IMAGE_NAME           Required. Repository name of the bundle image.
        BUNDLE_DIR           Directory holding the generated bundle and
                              bundle.Dockerfile.
                              Default: "olm-bundle".
        IMAGE_REGISTRY       Registry the image is tagged for and pushed to.
                              Default: "{{ .REGISTRY_NAME }}:{{ .REGISTRY_INTERNAL_PORT }}".
        IMAGE_TAG            Tag applied to the bundle image.
                              Default: "bundle".
        PLATFORMS            Comma-separated buildx target platforms.
                              Default: "linux/amd64,linux/arm64".
        WORKDIR              Directory where the task is executed.
                              Default: {{ .USER_WORKING_DIR }}
    vars:
      BUNDLE_DIR: '{{ .BUNDLE_DIR | default "olm-bundle" }}'
      IMAGE_REGISTRY: '{{ .IMAGE_REGISTRY | default (print .REGISTRY_NAME ":" .REGISTRY_INTERNAL_PORT) }}'
      IMAGE_TAG: '{{ .IMAGE_TAG | default "bundle" }}'
      PLATFORMS: '{{ .PLATFORMS | default "linux/amd64,linux/arm64" }}'
    requires:
      vars:
        - name: IMAGE_NAME
    dir: '{{ .WORKDIR | default .USER_WORKING_DIR }}'
    run: when_changed
    preconditions:
      - sh: 'test -d "{{ .BUNDLE_DIR }}"'
        msg: "BUNDLE_DIR '{{ .BUNDLE_DIR }}' does not exist"
    cmds:
      - >
        docker buildx build
        --builder {{ .DOCKER_BUILDER }}
        --platform {{ .PLATFORMS }}
        --tag {{ .IMAGE_REGISTRY }}/{{ .IMAGE_NAME }}:{{ .IMAGE_TAG }}
        -f {{ .BUNDLE_DIR }}/bundle.Dockerfile
        --push
        {{ .BUNDLE_DIR }}
